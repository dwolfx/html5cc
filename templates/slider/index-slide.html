                    <script type="text/javascript">
                  
                    
                    duration = '15s';
                    bannerSize = [300,250];
                    bannerElements = [];
                   
                    // ELEMENTOS DOS BANNERS
                        
                    var banners = [
                                {
                                    duration: 2,
                                    entrada:{
                                        from: "right",
                                        alpha: false,
                                        zoomout: false,
                                        zoomin: true
                                        
                                    },
                                    saida:{
                                        to: "left",
                                        alpha: false,
                                        zoomout: false,
                                        zoomin: false
                                    }
                                }
                                ,
                                {
                                    duration: 2,
                                    entrada:{
                                        from: "right",
                                        alpha: false,
                                        zoomout: false,
                                        zoomin: false
                                        
                                    },
                                    saida:{
                                        to: "left",
                                        alpha: false,
                                        zoomout: false,
                                        zoomin: false
                                    }
                                }
                                ,
                                {
                                    duration: 2,
                                    entrada:{
                                        from: "right",
                                        alpha: false,
                                        zoomout: false,
                                        zoomin: false
                                        
                                    },
                                    saida:{
                                        to: "left",
                                        alpha: false,
                                        zoomout: false,
                                        zoomin: false
                                    }
                                }
                                ,
                                {
                                    duration: 2,
                                    entrada:{
                                        from: "right",
                                        alpha: false,
                                        zoomout: false,
                                        zoomin: false
                                        
                                    },
                                    saida:{
                                        to: "center",
                                        alpha: false,
                                        zoomout: false,
                                        zoomin: false
                                    }
                                }
                                
                            ];
                        
                       
                        
                        var elemCSSOriginal = document.getElementById("elemCSS").innerHTML;
                        var durationCSSOrig = document.getElementById("durationCSS").innerHTML;                       
                        
                        
                        
                        function initBanner(){
                            
                            var totalTime = 0;
                            
                            for(b in banners)
                                totalTime +=banners[b].duration;
                            
                            duration = totalTime+"s";
                            
                            for(i in banners){
                            
                                
                                var temp = {
                                'delay': '75%',
                                'posicao_e_top': '0px',
                                'posicao_s_top': '0px',
                                'posicao_e_left': '0px',
                                'posicao_s_left': '0px',
                                'delay_plus5': '80%',
                                'zoom_i':'1',
                                'zoom_f':'1',
                                'alpha_i':'1',
                                'alpha_f':'1',
                                'delay_plus5_plusduration_less5':'95%',
                                'delay_plus5_plusduration': '100%'                                
                                
                                }
                                
                                duracao = banners[i].duration*100/totalTime;
                                tempoInicio=0;
                                j=i-1;
                                while(j>=0){
                                    tempoInicio += banners[j].duration;
                                    j--;
                                }
                                
                                iniciaEm = tempoInicio*100/totalTime;
                                
                                if(i>0 && iniciaEm-5>=5)
                                    iniciaEm -=5
                                
                                
                                temp.delay = iniciaEm+"%";
                                temp.delay_plus5 = (iniciaEm+5)+"%";
                                if(i>=1)
                                    iniciaEm+=5
                                temp.delay_plus5_plusduration_less5 = (iniciaEm+duracao-5)+"%";
                                temp.delay_plus5_plusduration = (iniciaEm+duracao)+"%";
                                
                                switch (banners[i].entrada.from){
                                    
                                        
                                         case 'right': 
                                            temp.posicao_e_top= '0px';
                                            temp.posicao_e_left= bannerSize[0]+"px";
                                            break;
                                        case 'left': 
                                            temp.posicao_e_top= '0px';
                                            temp.posicao_e_left= (-1*bannerSize[0])+"px";
                                            break;
                                        case 'top': 
                                            temp.posicao_e_top= (-1*bannerSize[1])+"px",
                                            temp.posicao_e_left= "0px";
                                            break;
                                        case 'bottom': 
                                            
                                            temp.posicao_e_top=  bannerSize[1]+"px";
                                            temp.posicao_e_left= "0px";
                                            break;
                                        case 'center': 
                                            temp.posicao_e_top= "0px",
                                            temp.posicao_e_left= "0px";
                                            break;
                                }
                                
                                switch (banners[i].saida.to){
                                        
                                        case 'right':                                             
                                            temp.posicao_s_top= '0px';
                                            temp.posicao_s_left= (bannerSize[0])+"px";
                                            break;
                                        case 'left': 
                                            temp.posicao_s_top= '0px';
                                            temp.posicao_s_left= (-1*bannerSize[0])+"px";
                                            break;
                                        case 'top': 
                                            temp.posicao_s_top=  (-1*bannerSize[1])+"px";
                                            temp.posicao_s_left= "0px";
                                            break;
                                        case 'bottom': 
                                            temp.posicao_s_top= (bannerSize[1])+"px",
                                            temp.posicao_s_left= "0px";
                                            break;
                                        case 'center': 
                                            temp.posicao_s_top= "0px",
                                            temp.posicao_s_left= "0px";
                                            break;
                                }
                                if(banners[i].entrada.zoomin){
                                   // temp.posicao_e_top= (-1*bannerSize[1]/2)+'px';
                                  //  temp.posicao_e_left= (-1*bannerSize[0]/2)+'px';
                                    temp.zoom_i=2;
                                    temp.zoom_f=1;
                                }else{
                                    temp.zoom_i=1;
                                    temp.zoom_f=1;
                                    
                                }
                                if(banners[i].entrada.alpha){
                                    temp.alpha_i=0;
                                    temp.alpha_f=1;
                                } else {
                                    temp.alpha_i=1;
                                    temp.alpha_f=1;
                                    
                                }                               
                                
                                
                                bannerElements.push(temp);
                                
                            }
                            
                            var novoCSSElem="", novoDurationCss="";
                            var tempElemCss="";


                            for(i in bannerElements){
                                tempElemCss = elemCSSOriginal;
                                tempElemCss = tempElemCss.replace(/\{\{X\}\}/gm, i).replace(/\{\{zindeX\}\}/gm, Number(i)+500);                            
                                tempElemCss = tempElemCss.replace(/\{\{delay\}\}/gm, bannerElements[i].delay);
                                tempElemCss = tempElemCss.replace(/\{\{delay_plus5\}\}/gm, bannerElements[i].delay_plus5);
                                tempElemCss = tempElemCss.replace(/\{\{posicao_e_top\}\}/gm, bannerElements[i].posicao_e_top);
                                tempElemCss = tempElemCss.replace(/\{\{posicao_s_top\}\}/gm, bannerElements[i].posicao_s_top);
                                tempElemCss = tempElemCss.replace(/\{\{posicao_e_left\}\}/gm, bannerElements[i].posicao_e_left);
                                tempElemCss = tempElemCss.replace(/\{\{posicao_s_left\}\}/gm, bannerElements[i].posicao_s_left);

                                tempElemCss = tempElemCss.replace(/\{\{zoom_i\}\}/gm, bannerElements[i].zoom_i);
                                tempElemCss = tempElemCss.replace(/\{\{zoom_f\}\}/gm, bannerElements[i].zoom_f);
                                tempElemCss = tempElemCss.replace(/\{\{alpha_i\}\}/gm, bannerElements[i].alpha_i);
                                tempElemCss = tempElemCss.replace(/\{\{alpha_f\}\}/gm, bannerElements[i].alpha_f);

                                tempElemCss = tempElemCss.replace(/\{\{posicao_s_top\}\}/gm, bannerElements[i].posicao_s_top);
                                tempElemCss = tempElemCss.replace(/\{\{delay_plus5_plusduration_less5\}\}/gm, bannerElements[i].delay_plus5_plusduration_less5);
                                tempElemCss = tempElemCss.replace(/\{\{delay_plus5_plusduration\}\}/gm, bannerElements[i].delay_plus5_plusduration);
                                if(tempElemCss!=undefined){
                                    novoCSSElem += tempElemCss;
                                    novoDurationCss += durationCSSOrig.replace(/\{\{X\}\}/gm, i).replace(/\{\{total_duration\}\}/gm,duration);
                                }
                            }

                            document.getElementById("elemCSS").innerHTML = novoCSSElem;
                            document.getElementById("durationCSS").innerHTML = novoDurationCss;
                            document.getElementById("box-ad").className = "hiddenad";
                            setTimeout(function(){document.getElementById("box-ad").className = "animate"},100);
                            
                        }
                    
                        initBanner();                        
                        function reply_click()
                        {
                            initBanner();
                        }

                    </script>
